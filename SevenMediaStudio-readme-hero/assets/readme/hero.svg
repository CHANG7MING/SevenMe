<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SevenMedia Studio — local media workspace</title>
  <desc id="desc">A manga-inspired young creator and gray tabby cat operate a local media machine for compression, conversion, and editing.</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#171717" opacity=".075"/>
    </pattern>
    <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#171717" opacity=".28"/>
    </pattern>
    <clipPath id="panelClip"><rect x="654" y="57" width="489" height="306" rx="28"/></clipPath>
    <style>
      .ink{stroke:#171717;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#171717;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .micro{font:700 12px Arial,sans-serif;letter-spacing:2.4px}
      .label{font:700 13px Arial,sans-serif;letter-spacing:1px}
    </style>
  </defs>

  <rect width="1200" height="420" rx="32" fill="#f6f3ed"/>
  <rect width="1200" height="420" rx="32" fill="url(#dots)"/>
  <path d="M0 345C164 291 289 374 458 334S741 281 895 339s215 19 305-10v91H0Z" fill="#edf2ff" opacity=".72"/>
  <path d="M1010 0c-53 65-50 142 18 190s121 31 172 6V0Z" fill="#eee8ff" opacity=".82"/>

  <g transform="translate(64 66)">
    <g transform="translate(0 1)">
      <rect width="10" height="10" rx="5" fill="#7c5cff"/>
      <text x="24" y="10" class="micro" fill="#55515c">LOCAL MEDIA WORKSPACE</text>
    </g>
    <text x="0" y="78" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="800" letter-spacing="-2.7" fill="#171717">SevenMedia</text>
    <text x="0" y="137" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="800" letter-spacing="-2.7" fill="#171717">Studio</text>
    <path d="M3 158h112" stroke="#6b8dff" stroke-width="7" stroke-linecap="round"/>
    <path d="M126 158h73" stroke="#8b61ef" stroke-width="7" stroke-linecap="round"/>
    <text x="0" y="205" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#26242a">从压缩开始，</text>
    <text x="0" y="235" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#26242a">构建你的本地媒体工作台。</text>
    <text x="0" y="271" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#68646d">压缩已就绪 · 转换与剪辑正在加入</text>
    <g transform="translate(0 296)">
      <g><rect width="82" height="34" rx="17" fill="#fff" class="thin"/><text x="41" y="22" text-anchor="middle" class="label" fill="#3478e5">VIDEO</text></g>
      <g transform="translate(92)"><rect width="82" height="34" rx="17" fill="#fff" class="thin"/><text x="41" y="22" text-anchor="middle" class="label" fill="#7c5cff">IMAGE</text></g>
      <g transform="translate(184)"><rect width="82" height="34" rx="17" fill="#fff" class="thin"/><text x="41" y="22" text-anchor="middle" class="label" fill="#1f9e62">AUDIO</text></g>
    </g>
  </g>

  <g clip-path="url(#panelClip)">
    <rect x="654" y="57" width="489" height="306" rx="28" fill="#fffdf9" class="ink"/>
    <rect x="654" y="57" width="489" height="306" fill="url(#halftone)" opacity=".18"/>
    <circle cx="1110" cy="81" r="126" fill="#eee8ff" opacity=".85"/>
    <circle cx="685" cy="359" r="92" fill="#e7f0ff" opacity=".82"/>

    <!-- product workbench: the website is the hero, not the Skill rules -->
    <g transform="translate(676 78)">
      <rect width="445" height="258" rx="20" fill="#111116" stroke="#171717" stroke-width="4"/>
      <path d="M0 42h445" stroke="#3b3941" stroke-width="2"/>
      <circle cx="19" cy="21" r="5" fill="#ff645d"/><circle cx="36" cy="21" r="5" fill="#ffbd45"/><circle cx="53" cy="21" r="5" fill="#33c75a"/>
      <text x="222" y="25" text-anchor="middle" class="micro" fill="#d7d3dc">SEVENMEDIA STUDIO</text>

      <rect x="14" y="56" width="92" height="188" rx="13" fill="#18181e" stroke="#3b3941" stroke-width="2"/>
      <text x="27" y="76" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#77727f">MEDIA</text>
      <g transform="translate(24 88)"><rect width="68" height="34" rx="9" fill="#25304a" stroke="#6b8dff"/><path d="M10 11h15v12H10z" fill="none" stroke="#70a6ff" stroke-width="2"/><path d="m25 14 7-4v14l-7-4" fill="none" stroke="#70a6ff" stroke-width="2"/><text x="39" y="21" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#fff">VIDEO</text></g>
      <g transform="translate(24 130)"><rect width="68" height="34" rx="9" fill="#202027" stroke="#3b3941"/><path d="M10 10h17v14H10z" fill="none" stroke="#8c8792" stroke-width="2"/><path d="m12 21 5-5 4 4 3-3" fill="none" stroke="#8c8792" stroke-width="2"/><text x="39" y="21" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#bbb6c1">IMAGE</text></g>
      <g transform="translate(24 172)"><rect width="68" height="34" rx="9" fill="#202027" stroke="#3b3941"/><path d="M18 9v16m-6-11v7m12-9v11" stroke="#8c8792" stroke-width="2"/><text x="39" y="21" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#bbb6c1">AUDIO</text></g>

      <rect x="118" y="56" width="211" height="188" rx="13" fill="#16161c" stroke="#3b3941" stroke-width="2"/>
      <rect x="133" y="72" width="181" height="105" rx="10" fill="#242733" stroke="#585361" stroke-width="2" stroke-dasharray="5 5"/>
      <circle cx="223" cy="113" r="24" fill="#202a42" stroke="#6b8dff" stroke-width="2"/>
      <path d="M223 99v28m-14-14h28" stroke="#70a6ff" stroke-width="3" stroke-linecap="round"/>
      <text x="223" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#e8e4ec">DROP A MEDIA FILE</text>
      <text x="133" y="197" font-family="Arial,sans-serif" font-size="9" fill="#8c8792">ORIGINAL</text><text x="303" y="197" text-anchor="end" font-family="Arial,sans-serif" font-size="9" fill="#8c8792">28 MB</text>
      <rect x="133" y="207" width="181" height="7" rx="4" fill="#36343d"/><rect x="133" y="207" width="121" height="7" rx="4" fill="#6b8dff"/>
      <rect x="133" y="223" width="181" height="10" rx="5" fill="#765be2"/><text x="223" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="700" fill="#fff">START COMPRESS</text>

      <rect x="341" y="56" width="90" height="188" rx="13" fill="#18181e" stroke="#3b3941" stroke-width="2"/>
      <text x="354" y="77" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#77727f">OUTPUT</text>
      <text x="354" y="101" font-family="Arial,sans-serif" font-size="9" fill="#aaa5b0">TARGET</text><text x="418" y="101" text-anchor="end" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#fff">10 MB</text>
      <path d="M354 111h64" stroke="#3b3941"/>
      <text x="354" y="132" font-family="Arial,sans-serif" font-size="9" fill="#aaa5b0">QUALITY</text><text x="418" y="132" text-anchor="end" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#fff">HIGH</text>
      <path d="M354 142h64" stroke="#3b3941"/>
      <rect x="354" y="158" width="64" height="27" rx="8" fill="#6652c8"/><text x="386" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#fff">COMPRESS</text>
      <circle cx="359" cy="207" r="4" fill="#32c46b"/><text x="369" y="210" font-family="Arial,sans-serif" font-size="8" fill="#aaa5b0">LOCAL ONLY</text>

      <!-- visible roadmap: conversion and editing are product capabilities in progress -->
      <g transform="translate(125 254)">
        <g><rect width="89" height="30" rx="15" fill="#e6efff" stroke="#3478e5" stroke-width="2"/><path d="M14 10h12m0 0-4-4m4 4-4 4M26 20H14m0 0 4-4m-4 4 4 4" fill="none" stroke="#3478e5" stroke-width="2"/><text x="55" y="19" text-anchor="middle" class="label" fill="#3478e5">CONVERT</text></g>
        <g transform="translate(100)"><rect width="89" height="30" rx="15" fill="#eee8ff" stroke="#7c5cff" stroke-width="2"/><path d="m13 8 16 14M29 8 13 22" stroke="#7c5cff" stroke-width="2"/><circle cx="11" cy="7" r="3" fill="none" stroke="#7c5cff" stroke-width="2"/><circle cx="31" cy="7" r="3" fill="none" stroke="#7c5cff" stroke-width="2"/><text x="59" y="19" text-anchor="middle" class="label" fill="#7c5cff">EDIT</text></g>
        <text x="203" y="20" class="micro" fill="#6c6772">NEXT</text>
      </g>
    </g>

    <!-- small SevenVisual brand character -->
    <g transform="translate(646 254) scale(.45)">
      <ellipse cx="83" cy="58" rx="48" ry="50" fill="#fff" class="ink"/>
      <path d="M39 54C36 24 58 4 88 5c31 0 47 19 45 47-12-2-23-9-29-19-14 14-33 22-56 20Z" fill="#29272b" class="ink"/>
      <circle cx="70" cy="60" r="4" fill="#171717"/><circle cx="104" cy="60" r="4" fill="#171717"/><path d="M78 78c9 7 18 7 27-1" fill="none" class="thin"/>
      <path d="M47 105c20-12 58-12 78 0l9 81H37Z" fill="#fff" class="ink"/>
      <path d="M49 113c18 13 49 14 73 0" fill="none" class="thin"/>
    </g>

    <!-- gray tabby cat with orange collar -->
    <g transform="translate(1060 270) scale(.68)">
      <path d="M26 32 18 5l25 16c13-7 29-7 42 0l24-16-7 28c10 12 13 29 9 46-5 23-24 38-48 38S19 103 14 80c-4-18 0-35 12-48Z" fill="#bbbcc1" class="ink"/>
      <path d="M44 22 48 8m13 11V4m15 18L83 8" class="thin" fill="none"/>
      <path d="M28 66c8-8 16-8 24 0m21 0c8-8 16-8 24 0" class="thin" fill="none"/>
      <path d="M57 76c4 4 8 4 12 0 4 4 8 4 12 0" class="thin" fill="none"/>
      <path d="M26 91c24 11 51 11 79-1" fill="none" stroke="#f28b32" stroke-width="8" stroke-linecap="round"/>
      <path d="M32 103c-9 19-8 37 3 54m65-54c11 19 10 37-2 54" fill="none" class="ink"/>
      <path d="M102 130c26 2 39 13 34 30-4 13-18 14-27 7" fill="none" class="ink"/>
    </g>
  </g>
  <rect x="654" y="57" width="489" height="306" rx="28" fill="none" class="ink"/>

  <g transform="translate(1070 379)">
    <circle cx="0" cy="0" r="5" fill="#32c46b"/>
    <text x="14" y="5" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#55515c">OFFLINE READY</text>
  </g>
</svg>
